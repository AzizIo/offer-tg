name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main, "feat/offer-platform-v2"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall -q offerbot "bot3 (1).py"
      - name: Test
        run: pytest --cov=offerbot --cov-report=term-missing
